name: translator_flutter
description: Flutter client for Translator. Seamlessly connects to Laravel Translator API with offline caching, localized digits, and South Asian number formatting.
version: 1.0.0
homepage: https://github.com/ataurbdx/translator

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
